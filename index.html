        body { background: var(--bg-base); color: var(--text-main); font-family: 'Plus Jakarta Sans', sans-serif; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
        button { border: none; background: none; cursor: pointer; font-family: inherit; color: white; transition: var(--transition); }

        .search-box { background: rgba(255,255,255,0.04); border-radius: var(--radius-full); padding: 12px 26px; width: 360px; border: 1px solid var(--glass-border); display: flex; align-items: center; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); transition: var(--transition); }

        .hero-overlay { position: absolute; inset: 0; background: linear-gradient(90deg, #060709 30%, rgba(6,7,9,0.3) 70%, transparent 100%), linear-gradient(0deg, #060709 15%, rgba(6,7,9,0) 60%); }

        .video-wrapper { width: 100%; background: #000; position: sticky; top: 0; z-index: 100; box-shadow: 0 20px 50px rgba(0,0,0,0.8); }

        .action-bar { display: flex; justify-content: space-between; align-items: center; padding: 22px 6%; background: #090a0d; border-bottom: 1px solid var(--glass-border); }
        .btn-close-text { color: var(--text-dim); font-weight: 700; font-size: 0.95rem; display: flex; align-items: center; gap: 8px; }

        .player-body { padding: 40px 6%; }

        .info-grid { display: flex; flex-direction: column; gap: 35px; margin-top: 15px; }
        .detail-poster { display: none; border-radius: 18px; overflow: hidden; aspect-ratio: 2/3; width: 200px; box-shadow: 0 15px 40px rgba(0,0,0,0.5); border: 1px solid var(--glass-border); }

        .server-flex { display: flex; gap: 12px; flex-wrap: wrap; }

        .btn-server:hover { background: rgba(255,255,255,0.08); }

        .btn-download { display: inline-flex; align-items: center; gap: 12px; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); color: var(--pure-white); padding: 18px 36px; border-radius: 14px; font-weight: 700; font-size: 1rem; text-decoration: none; transition: var(--transition); margin-top: 30px; }
        .btn-download:hover { background: var(--pure-white); color: black; border-color: transparent; transform: translateY(-4px); }

        .meta-info h1 { font-size: 2.4rem; font-weight: 800; margin-bottom: 16px; line-height: 1.2; letter-spacing: -0.8px; }
        .modal-meta { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; margin-bottom: 24px; font-weight: 700; font-size: 0.95rem; }
        .overview { color: var(--text-dim); line-height: 1.9; font-size: 1.05rem; }
        .tags-container { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 24px; }

        .load-more-container { display: flex; justify-content: center; padding: 20px 0 80px; }

    { name: 'Server 3', url: (id, s, e) => (s && e) ? `https://embed.filmu.in/tv/${id}/${s}/${e}` : `https://embed.filmu.in/movie/${id}` },
    
    // UPDATE CLOUD 4: Menggunakan vidsrc.cc
    { name: 'Server 4', url: (id, s, e) => (s && e) ? `https://vidsrc.cc/v2/embed/tv/${id}/${s}/${e}` : `https://vidsrc.cc/v2/embed/movie/${id}` },
    
    { name: 'Server 5', url: (id, s, e) => {
        if (state.activeType === 'tv' && s && e) {
            return `https://streamimdb.ru/embed/tv/${id}/${s}/${e}`;
        }
        return `https://streamimdb.ru/embed/movie/${id}`;
    }},
    
    // UPDATE CLOUD 6: Menggunakan vidsrc.to (Sebagai cadangan/alternatif)
    { name: 'Server 6', url: (id, s, e) => (s && e) ? `https://vidsrc-embed.ru/embed/tv/${id}/${s}/${e}` : `https://vidsrc-embed.ru/embed/movie/${id}` }
];

        let state = { page: 1, currentGenre: '', currentProvider: 'all', activeItem: null, activeType: 'movie', activeSeason: 1, activeEpisode: 1, activeServer: 0 };

        const app = {
            async init() {
                await this.fetchGenres();
                await this.loadHero();
                await this.fetchMovies();
                window.onscroll = () => {
                    const nav = document.getElementById('navbar');
                    window.scrollY > 50 ? nav.classList.add('scrolled') : nav.classList.remove('scrolled');
                };
            },
            async fetchGenres() {
                const res = await fetch(`${BASE_URL}/genre/movie/list?api_key=${API_KEY}&language=en-US`);
                const data = await res.json();
                const container = document.getElementById('genreFilters');
                container.innerHTML = `<button class="filter-pill active" onclick="filterGenre('', this)">All Genres</button>`;
                data.genres.forEach(g => {
                    container.innerHTML += `<button class="filter-pill" onclick="filterGenre('${g.id}', this)">${g.name}</button>`;
                });
            },
            async loadHero() {
                const res = await fetch(`${BASE_URL}/trending/all/day?api_key=${API_KEY}&language=en-US`);
                const data = await res.json();
                const m = data.results[Math.floor(Math.random() * 5)];
                const type = m.media_type || 'movie';
                document.getElementById('heroBg').innerHTML = `<img src="${IMG_ORIG}${m.backdrop_path}">`;
                document.getElementById('heroTitle').innerText = m.title || m.name;
                document.getElementById('h-desc').innerText = m.overview || "No English plot details available for this title.";
                document.getElementById('h-year').innerText = (m.release_date || m.first_air_date || '').split('-')[0];
                document.getElementById('h-rate').innerText = m.vote_average ? m.vote_average.toFixed(1) : '0.0';
                document.getElementById('h-type').innerText = type.toUpperCase();
                
                document.getElementById('heroPlayBtn').onclick = (e) => { 
                    e.stopPropagation(); 
                    ui.openConfirmBox(m.id, (m.title || m.name).replace(/'/g, "\\'"), type); 
                };
                document.getElementById('hero').onclick = () => document.getElementById('heroPlayBtn').click();
            },
            async fetchMovies() {
                let url = state.currentProvider === 'all' ? `${BASE_URL}/trending/all/week?api_key=${API_KEY}&page=${state.page}&language=en-US` : `${BASE_URL}/discover/movie?api_key=${API_KEY}&with_watch_providers=${state.currentProvider}&watch_region=US&page=${state.page}&language=en-US`;
                if (state.currentGenre) url = `${BASE_URL}/discover/movie?api_key=${API_KEY}&with_genres=${state.currentGenre}&page=${state.page}&language=en-US`;
                const res = await fetch(url);
                const data = await res.json();
                ui.renderGrid(data.results, state.page !== 1);
            }
        };

        const ui = {
            renderGrid(items, append) {
                const grid = document.getElementById('movieGrid');
                if (!append) grid.innerHTML = '';
                items.forEach(item => {
                    if (!item.poster_path) return;
                    const type = item.media_type || (item.first_air_date ? 'tv' : 'movie');
                    const div = document.createElement('div');
                    div.className = 'movie-card';
                    div.innerHTML = `<img src="${IMG_W500}${item.poster_path}">`;
                    
                    const cleanTitle = (item.title || item.name).replace(/'/g, "\\'");
                    div.onclick = () => this.openConfirmBox(item.id, cleanTitle, type);
                    grid.appendChild(div);
                });
            },
            openConfirmBox(id, title, type) {
                const confirmOverlay = document.getElementById('confirmOverlay');
                document.getElementById('confirmMovieName').innerText = `"${title}"`;
                confirmOverlay.style.display = 'flex';
                setTimeout(() => confirmOverlay.classList.add('show'), 10);
                
                document.getElementById('confirmPlayBtn').onclick = () => {
                    this.closeConfirmBox();
                    this.openModal(id, title, type);
                };
            },
            closeConfirmBox() {
                const confirmOverlay = document.getElementById('confirmOverlay');
                confirmOverlay.classList.remove('show');
                setTimeout(() => confirmOverlay.style.display = 'none', 400);
            },
            async openModal(id, title, type) {
                state.activeItem = id; state.activeType = type; state.activeSeason = 1; state.activeEpisode = 1; state.activeServer = 0;
                
                this.switchTab('watch-tab', document.querySelector('.tab-btn'));
                
                const modal = document.getElementById('playerModal');
                modal.style.display = 'flex';
                document.body.style.overflow = 'hidden';
                document.getElementById('m-title').innerText = title;
                
                const res = await fetch(`${BASE_URL}/${type}/${id}?api_key=${API_KEY}&language=en-US`);
                const data = await res.json();
                
                document.getElementById('m-overview').innerText = data.overview || "Synopsis not available.";
                document.getElementById('m-year').innerText = (data.release_date || data.first_air_date || '').split('-')[0];
                document.getElementById('m-rate').innerText = data.vote_average ? data.vote_average.toFixed(1) : '0.0';
                document.getElementById('m-type').innerText = type.toUpperCase();
                document.getElementById('m-poster').innerHTML = `<img src="${IMG_W500}${data.poster_path}" style="width:100%;height:100%;object-fit:cover;">`;
                
                const tagBox = document.getElementById('m-genres'); tagBox.innerHTML = '';
                if(data.genres) data.genres.forEach(g => tagBox.innerHTML += `<span class="tag">${g.name}</span>`);
                
                const dlBtn = document.getElementById('downloadBtn');
                dlBtn.href = type === 'tv' ? `https://vidvault.ru/tv/${id}/1/1` : `https://vidvault.ru/movie/${id}`;

                this.renderServers();
                if (type === 'tv') {
                    document.getElementById('tvControls').style.display = 'block';
                    this.renderSeasons(data.seasons);
                } else {
                    document.getElementById('tvControls').style.display = 'none';
                }
                this.updateIframe();
            },
            switchTab(tabId, el) {
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.getElementById(tabId).classList.add('active');
                el.classList.add('active');
            },
            renderServers() {
                const box = document.getElementById('serverList'); box.innerHTML = '';
                SERVERS.forEach((s, i) => {
                    const btn = document.createElement('button');
                    btn.className = `btn-server ${i === state.activeServer ? 'active' : ''}`;
                    btn.innerText = s.name;
                    btn.onclick = () => { state.activeServer = i; this.renderServers(); this.updateIframe(); };
                    box.appendChild(btn);
                });
            },
            renderSeasons(seasons) {
                const box = document.getElementById('m-seasons'); box.innerHTML = '';
                seasons.filter(s => s.season_number > 0).forEach(s => {
                    const btn = document.createElement('button');
                    btn.className = `filter-pill ${s.season_number === state.activeSeason ? 'active' : ''}`;
                    btn.innerText = `Season ${s.season_number}`;
                    btn.onclick = () => { state.activeSeason = s.season_number; state.activeEpisode = 1; this.renderSeasons(seasons); this.fetchEpisodes(); };
                    box.appendChild(btn);
                });
                this.fetchEpisodes();
            },
            async fetchEpisodes() {
                const res = await fetch(`${BASE_URL}/tv/${state.activeItem}/season/${state.activeSeason}?api_key=${API_KEY}&language=en-US`);
                const data = await res.json();
                const box = document.getElementById('m-episodes'); box.innerHTML = '';
                data.episodes.forEach(e => {
                    const btn = document.createElement('button');
                    btn.className = `btn-ep ${e.episode_number === state.activeEpisode ? 'active' : ''}`;
                    btn.innerText = e.episode_number;
                    btn.onclick = () => { state.activeEpisode = e.episode_number; this.fetchEpisodes(); this.updateIframe(); };
                    box.appendChild(btn);
                });
            },
                    updateIframe() {
                const isTv = state.activeType === 'tv';
                const s = isTv ? state.activeSeason : null;
                const e = isTv ? state.activeEpisode : null;
                
                const iframe = document.getElementById('mainIframe');
                iframe.src = SERVERS[state.activeServer].url(state.activeItem, s, e);
                
                // ATURAN SANDBOX UNIVERSAL
                const permissions = 'allow-scripts allow-same-origin allow-forms allow-presentation allow-popups';
                iframe.setAttribute('sandbox', permissions);
                
                // Menambahkan allowfullscreen agar tombol fullscreen iframe aktif
                iframe.setAttribute('allowfullscreen', 'true');
                iframe.setAttribute('webkitallowfullscreen', 'true');
                iframe.setAttribute('mozallowfullscreen', 'true');
                
                // Pastikan tag iframe di HTML juga memiliki atribut allow="fullscreen"
                iframe.setAttribute('allow', 'autoplay; encrypted-media; fullscreen');
                
                iframe.style.transform = 'scale(1)'; 
                
                // Link download
                if(isTv) {
                    document.getElementById('downloadBtn').href = `https://vidvault.ru/tv/${state.activeItem}/${s}/${e}`;
                } else {
                    document.getElementById('downloadBtn').href = `https://vidvault.ru/movie/${state.activeItem}`;
                }
            },
            closeModal() {
                document.getElementById('playerModal').style.display = 'none';
                document.getElementById('mainIframe').src = '';
                document.body.style.overflow = 'auto';
            }
        }; 

        function filterData(pid, el) { 
            state.page = 1; state.currentProvider = pid; state.currentGenre = '';
            document.querySelectorAll('#providerFilters .filter-pill').forEach(b => b.classList.remove('active'));
            el.classList.add('active'); app.fetchMovies(); 
        }
        
        function filterGenre(gid, el) { 
            state.page = 1; state.currentGenre = gid; state.currentProvider = 'all';
            document.querySelectorAll('#genreFilters .filter-pill').forEach(b => b.classList.remove('active'));
            el.classList.add('active'); app.fetchMovies(); 
        }
        
        function loadMore() { state.page++; app.fetchMovies(); }
        
        let searchTimeout;
        async function handleSearch(e) {
            clearTimeout(searchTimeout);
            const q = e.target.value;
            searchTimeout = setTimeout(async () => {
                if (q.length > 2) {
                    const res = await fetch(`${BASE_URL}/search/multi?api_key=${API_KEY}&query=${q}&language=en-US&include_adult=false`);
                    const data = await res.json();
                    ui.renderGrid(data.results, false);
                } else if (q.length === 0) {
                    app.fetchMovies();
                }
            }, 500);
        }

        app.init();
    </script>
</body>
</html>
